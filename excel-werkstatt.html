<script>
'use strict';
/* =====================================================================
   HILFSFUNKTIONEN
   ===================================================================== */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function colName(c){let s='';c++;while(c>0){const m=(c-1)%26;s=String.fromCharCode(65+m)+s;c=Math.floor((c-1)/26);}return s;}
function colIndex(s){let n=0;for(const ch of s.toUpperCase())n=n*26+(ch.charCodeAt(0)-64);return n-1;}
const A=(c,r)=>colName(c)+(r+1);
function parseA(a){const m=/^\$?([A-Z]{1,3})\$?(\d+)$/i.exec(String(a).trim());return m?{c:colIndex(m[1]),r:+m[2]-1}:null;}
const store={get(k,d){try{const v=localStorage.getItem('xlw9_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('xlw9_'+k,JSON.stringify(v));}catch(e){}},del(k){try{localStorage.removeItem('xlw9_'+k);}catch(e){}}};
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o,(k,v)=>k==='_ast'?undefined:v));

/* ---------- Datum ---------- */
const DAY=86400000,EPOCH=Date.UTC(1899,11,30);
const serial=(y,m,d)=>Math.round((Date.UTC(y,m-1,d)-EPOCH)/DAY);
function fromSerial(s){const d=new Date(EPOCH+Math.floor(s)*DAY);return{y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate(),wd:d.getUTCDay()};}
function todaySerial(){const n=new Date();return serial(n.getFullYear(),n.getMonth()+1,n.getDate());}
const WD=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MO=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const LISTS=[['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'],['Mo','Di','Mi','Do','Fr','Sa','So'],MO,['Jan','Feb','Mrz','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez']];

/* ---------- Fehlerwerte ---------- */
class XErr{constructor(e){this.e=e;}}
const isErr=v=>v instanceof XErr;
const E={NAME:new XErr('#NAME?'),VALUE:new XErr('#WERT!'),DIV0:new XErr('#DIV/0!'),REF:new XErr('#BEZUG!'),NUM:new XErr('#ZAHL!')};
class FErr extends Error{constructor(m,code){super(m);this.code=code;}}

/* ---------- Anzeige-Formate ---------- */
const pad=n=>String(n).padStart(2,'0');
function fmtGeneral(n){if(!isFinite(n))return '#ZAHL!';if(Number.isInteger(n)&&Math.abs(n)<1e11)return String(n);let s=+n.toPrecision(10);let t=String(s);if(/e/.test(t))t=s.toExponential(4).replace('e+','E+');return t.replace('.',',');}
const fmtFixed=(n,d)=>n.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtDate=s=>{const d=fromSerial(s);return pad(d.d)+'.'+pad(d.m)+'.'+d.y;};
function fmtTime(x,sec){let f=x-Math.floor(x);let t=Math.round(f*86400);if(t>=86400)t=0;const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return pad(h)+':'+pad(m)+(sec?':'+pad(s):'');}
function fmtVal(v,fmt){
  if(v==null)return '';
  if(isErr(v))return v.e;
  if(typeof v==='boolean')return v?'WAHR':'FALSCH';
  if(typeof v==='string')return v;
  switch(fmt){
    case 'date':return v<0?'########':fmtDate(v);
    case 'datelong':{if(v<0)return '########';const d=fromSerial(v);return WD[d.wd]+', '+d.d+'. '+MO[d.m-1]+' '+d.y;}
    case 'time':return fmtTime(v);
    case 'datetime':return fmtDate(v)+' '+fmtTime(v);
    case 'currency':return fmtFixed(v,2)+' €';
    case 'number':return fmtFixed(v,2);
    case 'percent':return fmtGeneral(Math.round(v*10000)/100)+'%';
    default:return fmtGeneral(v);
  }
}

/* ---------- Eingabe deuten ---------- */
function parseLiteral(t){
  if(t.startsWith("'"))return{v:t.slice(1)};
  const s=t.trim();let m;
  if(s==='')return{v:null};
  if(/^[-+]?\d+(,\d+)?$/.test(s))return{v:parseFloat(s.replace(',','.'))};
  if(/^[-+]?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))return{v:parseFloat(s.replace(/\./g,'').replace(',','.'))};
  if(m=/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})?$/.exec(s)||/^(\d{1,2})\.(\d{1,2})$/.exec(s)){
    const d=+m[1],mo=+m[2];let y=m[3]?+m[3]:new Date().getFullYear();if(y<100)y+=y<30?2000:1900;
    if(mo>=1&&mo<=12&&d>=1&&d<=31){const sr=serial(y,mo,d);const b=fromSerial(sr);if(b.d===d)return{v:sr,fmt:'date'};}
    if(/^\d+\.\d+$/.test(s))return{v:parseFloat(s)};
  }
  if(/^[-+]?\d+\.\d+$/.test(s))return{v:parseFloat(s)};
  if(m=/^(\d{1,2}):(\d{2})(:(\d{2}))?$/.exec(s)){const h=+m[1],mi=+m[2],se=m[4]?+m[4]:0;if(mi<60&&se<60)return{v:(h*3600+mi*60+se)/86400,fmt:'time'};}
  if(m=/^([-+]?[\d.]*\d(,\d+)?)\s*€$/.exec(s)){const n=parseFloat(m[1].replace(/\./g,'').replace(',','.'));if(!isNaN(n))return{v:n,fmt:'currency'};}
  if(m=/^([-+]?\d+(,\d+)?)\s*%$/.exec(s))return{v:parseFloat(m[1].replace(',','.'))/100,fmt:'percent'};
  if(/^wahr$/i.test(s))return{v:true};if(/^falsch$/i.test(s))return{v:false};
  return{v:t};
}

/* =====================================================================
   FORMEL-ENGINE
   ===================================================================== */
function tokenize(src){
  const T=[];let i=0;const n=src.length;
  while(i<n){
    const ch=src[i];
    if(ch===' '){i++;continue;}
    if(ch==='"'){let j=i+1,s='';while(j<n){if(src[j]==='"'){if(src[j+1]==='"'){s+='"';j+=2;continue;}break;}s+=src[j];j++;}
      if(j>=n)throw new FErr('Ein Anführungszeichen fehlt.','quote');T.push({t:'str',v:s});i=j+1;continue;}
    const rest=src.slice(i);let m;
    if(rest.startsWith('#BEZUG!')){T.push({t:'err'});i+=7;continue;}
    if(m=/^\d+([.,]\d+)?/.exec(rest)){
      if(/^\d+[.,]\d+/.test(rest)||!/^\d+[A-Za-zÄÖÜäöü]/.test(rest)){T.push({t:'num',v:parseFloat(m[0].replace(',','.'))});i+=m[0].length;continue;}
    }
    if(m=/^(\$?)([A-Za-z]{1,3})(\$?)(\d+)(?![A-Za-z0-9_(ÄÖÜäöüß])/.exec(rest)){T.push({t:'ref',c:colIndex(m[2]),r:+m[4]-1,ac:!!m[1],ar:!!m[3]});i+=m[0].length;continue;}
    if(m=/^[A-Za-zÄÖÜäöüß_][A-Za-zÄÖÜäöüß0-9_.]*/.exec(rest)){T.push({t:'id',v:m[0].toUpperCase()});i+=m[0].length;continue;}
    if(m=/^(<=|>=|<>)/.exec(rest)){T.push({t:'op',v:m[0]});i+=2;continue;}
    if('+-*/^&=<>%'.includes(ch)){T.push({t:'op',v:ch});i++;continue;}
    if('();:'.includes(ch)){T.push({t:ch});i++;continue;}
    if(ch===',')throw new FErr('Komma statt Semikolon','comma');
    throw new FErr('Das Zeichen „'+ch+'“ versteht Excel hier nicht.','char');
  }
  return T;
}
function parseFormula(src){
  const T=tokenize(src);let p=0;
  const next=()=>T[p++];const isOp=v=>T[p]&&T[p].t==='op'&&T[p].v===v;
  const CMP=['=','<>','<','>','<=','>='];
  function expr(){let a=concat();while(T[p]&&T[p].t==='op'&&CMP.includes(T[p].v)){const op=next().v;a={k:'bin',op,a,b:concat()};}return a;}
  function concat(){let a=add();while(isOp('&')){next();a={k:'bin',op:'&',a,b:add()};}return a;}
  function add(){let a=mul();while(isOp('+')||isOp('-')){const op=next().v;a={k:'bin',op,a,b:mul()};}return a;}
  function mul(){let a=pw();while(isOp('*')||isOp('/')){const op=next().v;a={k:'bin',op,a,b:pw()};}return a;}
  function pw(){let a=un();while(isOp('^')){next();a={k:'bin',op:'^',a,b:un()};}return a;}
  function un(){if(isOp('-')){next();return{k:'neg',a:un()};}if(isOp('+')){next();return un();}return post();}
  function post(){let a=prim();while(isOp('%')){next();a={k:'pct',a};}return a;}
  function prim(){
    const t=next();if(!t)throw new FErr('Die Formel ist unvollständig.','incomplete');
    if(t.t==='num')return{k:'num',v:t.v};
    if(t.t==='str')return{k:'str',v:t.v};
    if(t.t==='err')return{k:'errv'};
    if(t.t==='ref'){if(T[p]&&T[p].t===':'){next();const u=next();if(!u||u.t!=='ref')throw new FErr('Der Zellbereich ist unvollständig.','range');return{k:'range',a:t,b:u};}return{k:'ref',c:t.c,r:t.r};}
    if(t.t==='id'){
      if(T[p]&&T[p].t==='('){next();const args=[];
        if(T[p]&&T[p].t===')'){next();return{k:'fn',name:t.v,args};}
        while(true){if(T[p]&&(T[p].t===';'||T[p].t===')'))args.push({k:'missing'});else args.push(expr());
          const s=next();if(!s)throw new FErr('Eine Klammer fehlt.','paren');if(s.t===')')break;if(s.t!==';')throw new FErr('Hier erwartet Excel ein Semikolon ; oder eine Klammer ).','sep');}
        return{k:'fn',name:t.v,args};}
      if(t.v==='WAHR')return{k:'bool',v:true};if(t.v==='FALSCH')return{k:'bool',v:false};
      return{k:'name',v:t.v};
    }
    if(t.t==='('){const e=expr();const c=next();if(!c||c.t!==')')throw new FErr('Eine Klammer fehlt.','paren');return e;}

 merk:`<h4>Eine Formel schreiben</h4><ul><li>Eine Formel beginnt <b>immer</b> mit <code>=</code></li><li>Klicke die Zellen an, statt Zahlen zu tippen (Zellbezug, z. B. <code>B3</code>). Dann rechnet Excel automatisch neu.</li><li><kbd>Enter ↵</kbd> schließt die Formel ab, <kbd>Esc</kbd> bricht ab.</li></ul>
 <h4>Rechenzeichen</h4><table><tr><td><code>+</code></td><td>plus (Summe)</td></tr><tr><td><code>-</code></td><td>minus (Differenz)</td></tr><tr><td><code>*</code></td><td>mal (Produkt)</td></tr><tr><td><code>/</code></td><td>geteilt (Quotient)</td></tr></table>
 <h4>SUMME und Zellbereich</h4><ul><li><code>=SUMME(B4:B7)</code> addiert alle Zahlen von B4 <b>bis</b> B7.</li><li>Der Doppelpunkt <code>:</code> bedeutet „bis“.</li><li>Tipp: Tippe <code>=SU</code> – Excel schlägt dir Funktionen vor. Mit <kbd>Tab ⇥</kbd> übernimmst du den Vorschlag.</li></ul>
 <h4>Euro-Format</h4><ul><li>Register <b>Start</b> → Gruppe <b>Zahl</b> → <b>Währung</b></li><li>Siehst du <code>####</code>? Die Spalte ist zu schmal. Doppelklick auf den Spaltenrand passt die Breite an.</li></ul>`},

   diagnose:(k,c,v,ev)=>fnUsed(c.f,'SUMME')?'SUMME addiert die Tablets. Du sollst aber <b>Personen</b> zählen → ANZAHL.':'Prüfe den Bereich: Tablets = Spalte <b>D</b>, Zeile 5 bis 32.'},
  {type:'formula',sheet:'Dienstgeräte',cells:['G9'],expect:'=ANZAHL(C5:C32)',need:['ANZAHL'],title:'ANZAHL: Smartphones',
   text:'Wie viele Mitarbeiter/-innen haben <b>mindestens ein Smartphone</b>? Berechne es in <span class="goto" data-goto="G9">G9</span>.',
   hints:['Die Smartphones stehen in Spalte C.','Formel: <code>=ANZAHL(C5:C32)</code>'],solution:'G9: <code>=ANZAHL(C5:C32)</code>',
   diagnose:(k,c)=>fnUsed(c.f,'SUMME')?'SUMME addiert die Smartphones. Du sollst aber <b>Personen</b> zählen → ANZAHL.':'Prüfe den Bereich: Smartphones = Spalte <b>C</b>, Zeile 5 bis 32.'},
  {type:'formula',sheet:'Dienstgeräte',cells:['G6'],expect:'=ANZAHL2(A5:A32)',need:['ANZAHL2','ANZAHL'],title:'ANZAHL2: Alle Mitarbeiter/-innen',
   text:'Wie viele Personen arbeiten insgesamt in der Firma? Berechne es in <span class="goto" data-goto="G6">G6</span>.<br><br><b>ANZAHL2</b> zählt jede beschriftete Zelle – egal ob <b>Text oder Zahl</b>.',
   hints:['Die Namen sind Text. ANZAHL würde 0 ergeben – du brauchst <b>ANZAHL2</b>. Markiere die Namen von A5 bis A32.','Formel: <code>=ANZAHL2(A5:A32)</code>'],solution:'G6: <code>=ANZAHL2(A5:A32)</code>',
   diagnose:(k,c,v,ev)=>{if(eq(v,0)&&fnUsed(c.f,'ANZAHL'))return 'ANZAHL zählt nur Zellen mit <b>Zahlen</b>. Namen sind Text → nimm <b>ANZAHL2</b>.';if(eq(v,ev+1))return 'Eine Person zu viel – hast du die Überschrift „Name“ (A4) mitgezählt? Starte bei <b>A5</b>.';return 'Prüfe den Bereich: Die Namen stehen von <b>A5 bis A32</b>.';}},
  {type:'formula',sheet:'Dienstgeräte',cells:['G10'],expect:'=ANZAHLLEEREZELLEN(C5:C32)',need:['ANZAHLLEEREZELLEN'],title:'Leere Zellen zählen',
   text:'Wie viele Mitarbeiter/-innen haben <b>noch kein Smartphone</b>? Berechne es in <span class="goto" data-goto="G10">G10</span>.<br><br>Wenn eine Zelle <b>leer</b> ist, kann Excel auch das zählen!',
   hints:['Die Funktion heißt <b>ANZAHLLEEREZELLEN</b>. Tippe <code>=AN</code> und wähle sie aus der Liste.','Formel: <code>=ANZAHLLEEREZELLEN(C5:C32)</code>'],solution:'G10: <code>=ANZAHLLEEREZELLEN(C5:C32)</code>',
   needMsg:'Clever gerechnet! Aber Excel hat dafür eine eigene Funktion: <b>ANZAHLLEEREZELLEN</b>. Probier sie aus.',
   diagnose:()=>'Prüfe den Bereich: Smartphones = Spalte <b>C</b>, Zeile 5 bis 32.'}
 ],
 merk:`<h4>ANZAHL</h4><ul><li>Zählt, in wie vielen Zellen eine <b>Zahl</b> steht.</li><li>Die Zahlen werden <b>nicht</b> zusammengerechnet!</li><li>Beispiel: <code>=ANZAHL(B5:B32)</code> → Wie viele Personen haben einen Laptop?</li></ul>
 <h4>ANZAHL2</h4><ul><li>Zählt jede <b>beschriftete</b> Zelle – egal ob Text oder Zahl.</li><li>Beispiel: <code>=ANZAHL2(A5:A32)</code> → Wie viele Personen arbeiten in der Firma?</li></ul>
 <h4>ANZAHLLEEREZELLEN</h4><ul><li>Zählt die <b>leeren</b> Zellen.</li><li>Beispiel: <code>=ANZAHLLEEREZELLEN(C5:C32)</code> → Wer hat noch kein Smartphone?</li></ul>
 <h4>Achtung</h4><ul><li><b>SUMME</b> addiert die Zahlen (z. B. Anzahl der Geräte). <b>ANZAHL</b> zählt die Zellen (z. B. Anzahl der Personen).</li></ul>`},

 tasks:[
  {type:'formula',sheet:'Datum',cells:['B4'],expect:'=HEUTE()',need:['HEUTE'],title:'Das heutige Datum',
   text:'Excel hat eine Live-Funktion, die <b>immer</b> das aktuelle Datum anzeigt. Schreibe sie in <span class="goto" data-goto="B4">B4</span>.',
   hints:['Tippe <code>=HE</code> – Excel schlägt dir <b>HEUTE</b> vor.','Die Klammern bleiben leer: <code>=HEUTE()</code>'],solution:'B4: <code>=HEUTE()</code>',
   needMsg:'Das Datum stimmt – aber benutze die Funktion <code>=HEUTE()</code>. Dann ist es morgen automatisch das neue Datum.'},
  {type:'custom',sheet:'Datum',cells:['B3'],title:'Ein Datum eingeben',
   text:'Trage in <span class="goto" data-goto="B3">B3</span> deinen <b>nächsten</b> Geburtstag ein.<br><br>Schreibe im Format <b>TT.MM.JJJJ</b>, also z. B. <code>24.03.2027</code>.',
   hints:['Tag, Monat und Jahr werden durch <b>Punkte</b> getrennt. Excel erkennt das Datum dann automatisch.','Ist dein Geburtstag dieses Jahr schon vorbei? Dann nimm das <b>nächste</b> Jahr.'],solution:'Zum Beispiel <code>24.03.2027</code> in B3 eintippen',
   check:X=>{const c=X.cell('B3'),v=X.val('B3');if(X.isEmpty('B3'))return fail('B3 ist noch leer.','B3');
     if(typeof v!=='number'||!c||!isDateF(c.fmt))return fail('Excel hat das nicht als Datum erkannt. Schreibe mit Punkten: <b>TT.MM.JJJJ</b>, z. B. <code>24.03.2027</code>.','B3');
     const t=todaySerial();if(v<t)return fail('Dieses Datum liegt in der Vergangenheit. Nimm deinen <b>nächsten</b> Geburtstag – vielleicht ist er erst im nächsten Jahr.','B3');
     if(v>t+366)return fail('So lange musst du nicht warten! Nimm deinen <b>nächsten</b> Geburtstag.','B3');return{ok:true};}},
  {type:'formula',sheet:'Datum',cells:['B5'],expect:'=B3-B4',needRef:true,title:'Tage bis zum Geburtstag',
   text:'Berechne in <span class="goto" data-goto="B5">B5</span>, wie viele Tage es noch bis zu deinem Geburtstag dauert.<br><br>Ziehe dazu die zwei Datumswerte voneinander ab.',
   hints:['Das spätere Datum (Geburtstag) minus das frühere (heute).','Formel: <code>=B3-B4</code>'],solution:'B5: <code>=B3-B4</code>',
   diagnose:(k,c,v,ev)=>eq(v,-ev)?'Du bekommst eine negative Zahl – andersherum! <b>Geburtstag minus heute</b>: <code>=B3-B4</code>':null},
  {type:'custom',sheet:'Datum',cells:['B8'],title:'Ferienbeginn eintragen',
   text:'Angenommen, die Sommerferien beginnen am <b>02.08.2027</b>. Trage dieses Datum in <span class="goto" data-goto="B8">B8</span> ein.',
   hints:['Format TT.MM.JJJJ – mit Punkten.','Tippe <code>02.08.2027</code> und drücke <kbd>Enter ↵</kbd>.'],solution:'B8: <code>02.08.2027</code>',
   check:X=>{const c=X.cell('B8'),v=X.val('B8');if(X.isEmpty('B8'))return fail('B8 ist noch leer.','B8');if(!c||!isDateF(c.fmt)||typeof v!=='number')return fail('Excel hat das nicht als Datum erkannt. Schreibe <code>02.08.2027</code> – mit Punkten.','B8');if(v!==serial(2027,8,2))return fail('Das Datum stimmt nicht. Gesucht ist der <b>02.08.2027</b>.','B8');return{ok:true};}},
  {type:'custom',sheet:'Datum',cells:['B9'],title:'Der Shortcut Strg + .',
   text:'Es gibt noch einen schnelleren Weg zum heutigen Datum: eine Tastenkombination!<br><br>Klicke <span class="goto" data-goto="B9">B9</span> an, halte <kbd>Strg</kbd> gedrückt und drücke den <kbd>.</kbd> (Punkt).',
   hints:['Nicht tippen und nicht =HEUTE() schreiben – nur die Zelle markieren und die Tasten drücken.','Halte <kbd>Strg</kbd> gedrückt und tippe einmal auf die Punkt-Taste <kbd>.</kbd> (rechts neben dem Komma). Am Mac: <kbd>Ctrl</kbd> + <kbd>.</kbd>'],
   solution:'B9 markieren → Strg + . drücken',
   check:X=>{const c=X.cell('B9'),v=X.val('B9');if(X.isEmpty('B9'))return fail('B9 ist noch leer.','B9');if(c.f&&fnUsed(c.f,'HEUTE'))return fail('Richtig, aber probiere diesmal die Tastenkombination <kbd>Strg</kbd> + <kbd>.</kbd> aus. Lösche B9 mit <kbd>Entf</kbd> und versuche es nochmal.','B9');if(v!==todaySerial())return fail('In B9 soll das <b>heutige</b> Datum stehen.','B9');return{ok:true,note:'Unterschied: Strg + . schreibt ein <b>festes</b> Datum. =HEUTE() ändert sich jeden Tag.'};}},
  {type:'formula',sheet:'Datum',cells:['B10'],expect:'=B8-B9',needRef:true,title:'Tage bis zu den Ferien',
   text:'Berechne in <span class="goto" data-goto="B10">B10</span>, wie viele Tage es noch bis zu den Ferien sind.',
   hints:['Ferienbeginn minus heutiges Datum.','Formel: <code>=B8-B9</code>'],solution:'B10: <code>=B8-B9</code>',
   diagnose:(k,c,v,ev)=>eq(v,-ev)?'Negative Zahl – andersherum! <b>Ferien minus heute</b>.':null},
  {type:'custom',sheet:'Datum',cells:['B13','B14','B15'],title:'Rückgabe-Datum berechnen',
   text:'Du leihst ein Buch für <b>21 Tage</b> aus. Wann musst du es zurückgeben?<br><br>1. <span class="goto" data-goto="B13">B13</span>: heutiges Datum mit <code>=HEUTE()</code><br>2. <span class="goto" data-goto="B14">B14</span>: die Zahl <b>21</b><br>3. <span class="goto" data-goto="B15">B15</span>: Berechne das Rückgabedatum (Datum <b>plus</b> Tage).',
   hints:['Zu einem Datum kannst du Tage einfach <b>dazuzählen</b> (+).','B13: <code>=HEUTE()</code>, B14: <code>21</code>, B15: <code>=B13+B14</code>'],solution:'B13: <code>=HEUTE()</code>, B14: <code>21</code>, B15: <code>=B13+B14</code>',
   check:X=>{const t=todaySerial();if(X.isEmpty('B13'))return fail('B13 ist noch leer.','B13');const c13=X.cell('B13');if(X.val('B13')!==t)return fail('In B13 soll das heutige Datum stehen.','B13');if(!c13.f||!fnUsed(c13.f,'HEUTE'))return fail('B13 stimmt – aber nimm hier bitte die Funktion <code>=HEUTE()</code>.','B13');
     if(X.val('B14')!==21)return fail('In B14 soll die Zahl <b>21</b> stehen (die Ausleihdauer in Tagen).','B14');const c=X.cell('B15');if(X.isEmpty('B15'))return fail('B15 ist noch leer.','B15');if(!c.f)return fail('In B15 steht keine Formel. Rechne: <code>=B13+B14</code>','B15');
     const v=X.val('B15');if(isErr(v))return fail(errDiag(c.f,v),'B15');if(!eq(v,t+21))return fail('Das Rückgabedatum stimmt noch nicht. Rechne <b>heutiges Datum plus 21 Tage</b>.','B15');if(!isDateF(c.fmt))return fail('Das Ergebnis stimmt, wird aber als Zahl angezeigt. Formatiere B15 als <b>Datum, kurz</b> (Start → Zahl).','B15');
     if(!hasRef(c.f))return fail('Rechne mit den Zellen B13 und B14, nicht mit festen Zahlen: <code>=B13+B14</code>','B15');return{ok:true};}},
  {type:'formula',sheet:'Datum',cells:['B18'],expect:'=HEUTE()-14',need:['HEUTE'],title:'Tage rückwärts zählen',
   text:'Welches Datum war vor <b>14 Tagen</b>? Berechne es in <span class="goto" data-goto="B18">B18</span> mit der HEUTE-Funktion.',
   hints:['Du kannst direkt von HEUTE() Tage abziehen.','Formel: <code>=HEUTE()-14</code>'],solution:'B18: <code>=HEUTE()-14</code>',
   accept:(v,ev,k,c)=>eq(v,ev),diagnose:(k,c,v,ev)=>eq(v,ev+28)?'Das ist 14 Tage in der <b>Zukunft</b>. Rückwärts heißt: <b>minus</b>.':null}
 ],
 merk:`<h4>Heutiges Datum</h4><ul><li><code>=HEUTE()</code> zeigt immer das aktuelle Datum (Live-Funktion). Gut für Vorlagen.</li><li>Shortcut <kbd>Strg</kbd> + <kbd>.</kbd> schreibt das heutige Datum als <b>festen</b> Wert.</li></ul>
 <h4>Datum eingeben</h4><ul><li>Format <b>TT.MM.JJJJ</b>, z. B. <code>03.04.2023</code></li><li>Datumsformat einstellen: Register Start → Gruppe Zahl → <b>Datum, kurz</b></li></ul>
 <h4>Mit Datum rechnen</h4><ul><li><b>Differenz:</b> Datum minus Datum = Anzahl Tage → <code>=B3-B4</code></li><li><b>Summe:</b> Datum plus Tage = neues Datum → <code>=B13+B14</code></li><li><b>Rückwärts:</b> <code>=HEUTE()-2</code> → vor 2 Tagen</li></ul>`},

   text:'<i>WENN die Ampel rot ist, DANN stehen, SONST gehen.</i><br><br>Schreibe in <span class="goto" data-goto="B6">B6</span> eine WENN-Formel und ziehe sie dann nach <b>B7</b>.<br><br>Tippe <code>=WE</code> und beobachte die Hilfe von Excel!',

function gradeF(X,k,exp,{need=null,max=2,constPts=1}={}){
  const cell=X.cell(k),v=X.val(k),ev=X.evalF(exp);
  if(X.isEmpty(k))return{p:0,msg:'Nicht bearbeitet. Lösung: <code>'+esc(exp)+'</code>'};
  if(cell.f==null)return{p:0,msg:eq(v,ev)?'Ergebnis eingetippt statt mit einer Formel berechnet. Lösung: <code>'+esc(exp)+'</code>':'Keine Formel. Lösung: <code>'+esc(exp)+'</code>'};
  if(isErr(v))return{p:0,msg:errDiag(cell.f,v)+' Lösung: <code>'+esc(exp)+'</code>'};
  if(!eq(v,ev))return{p:0,msg:'Falsches Ergebnis mit <code>'+esc(cell.f)+'</code>. Richtig wäre z. B. <code>'+esc(exp)+'</code>'};
  if(need&&!need.some(n=>fnUsed(cell.f,n)))return{p:max-1,msg:'Ergebnis richtig, aber ohne die Funktion '+need[0]+' gerechnet: <code>'+esc(cell.f)+'</code>'};
  if(!hasRef(cell.f))return{p:constPts,msg:'Ergebnis richtig, aber mit festen Zahlen statt Zellbezügen: <code>'+esc(cell.f)+'</code>'};
  return{p:max,msg:'Richtig: <code>'+esc(cell.f)+'</code>'};
}

function fillSeries(cells,offsets,n){
  // cells: Quellzellen; liefert n neue Zellen
  const k=cells.length,K=cells.map(classify),out=[];
  const style=c=>{const o={};if(c)for(const p of ['fmt','b','i','u','fill','al','bd','sz','col'])if(c[p]!==undefined)o[p]=c[p];return o;};
  const copyAt=(srcIdx,tgtIdx)=>{const c=cells[srcIdx];if(!c)return null;const o=clone(c);delete o.src;if(o.f!=null){const a=offsets(tgtIdx),b=offsets(srcIdx);o.f=shiftFormula(o.f,a.dr-b.dr,a.dc-b.dc);}return o;};
  const all=t=>K.every(x=>x.t===t);
  for(let i=0;i<n;i++){
    const ti=k+i;let o=null;
    if(k===1){const x=K[0],c=cells[0];
      if(x.t==='num'&&isDateF(c.fmt)){o={...style(c),v:x.v+(c.fmt==='time'?(i+1)/24:(i+1))};}
      else if(x.t==='list'){const L=LISTS[x.li];let w=L[(x.idx+i+1)%L.length];if(x.up)w=w.toUpperCase();o={...style(c),v:w};}
      else if(x.t==='ntext'){o={...style(c),v:x.pre+(x.n+i+1)+x.suf};}
      else o=copyAt(0,ti);
    }else{
      if(all('num')){const xs=K.map(x=>x.v);let a,b;if(k===2){b=xs[1]-xs[0];a=xs[0];}else{const mx=(k-1)/2,my=xs.reduce((p,q)=>p+q,0)/k;let sxy=0,sxx=0;xs.forEach((y,j)=>{sxy+=(j-mx)*(y-my);sxx+=(j-mx)*(j-mx);});b=sxy/sxx;a=my-b*mx;}
        o={...style(cells[k-1]),v:Math.round((a+b*ti)*1e9)/1e9};}
      else if(all('list')&&K.every(x=>x.li===K[0].li)){const L=LISTS[K[0].li];const step=((K[1].idx-K[0].idx)%L.length+L.length)%L.length;o={...style(cells[k-1]),v:L[((K[k-1].idx+step*(i+1))%L.length)]};}
      else if(all('ntext')&&K.every(x=>x.pre===K[0].pre&&x.suf===K[0].suf)&&K[1].n!==K[0].n){const step=K[1].n-K[0].n;o={...style(cells[k-1]),v:K[0].pre+Math.max(0,K[k-1].n+step*(i+1))+K[0].suf};}
      else o=copyAt(i%k,ti);
    }
    if(o)o.src='fill';out.push(o);
  }
  return out;
}

function buildFeedback(r){
  const n=esc(r.name||'du'),P=[];
  const open={1:`Hervorragend, ${n}! Du beherrschst die Excel-Grundlagen richtig sicher – damit bist du bestens vorbereitet.`,2:`Sehr gut gemacht, ${n}! Fast alles sitzt schon richtig sicher.`,3:`Gut gemacht, ${n}! Vieles klappt schon sicher. An ein paar Stellen kannst du noch üben.`,4:`${n}, du hast die Grundlagen verstanden – einige Funktionen sitzen aber noch nicht ganz.`,5:`${n}, das war noch ziemlich schwierig für dich. Kein Problem: Mit etwas Übung schaffst du das!`,6:`${n}, Excel ist für dich noch neu. Lass dich nicht entmutigen – arbeite die Module noch einmal in Ruhe durch.`};
  P.push(open[r.note]);
  const T=Object.entries(r.topics).map(([k,v])=>({k,...v,pct:v.p/v.max*100}));
  const strong=T.filter(t=>t.pct>=80),weak=T.filter(t=>t.pct<60);
  if(strong.length)P.push('<b>Das kannst du schon richtig gut:</b> '+strong.map(t=>TOPICS[t.k]+' ('+t.p+'/'+t.max+' P.)').join(', ')+'.');
  if(weak.length){P.push('<b>Hier solltest du noch üben:</b>');weak.forEach(t=>{const m=MODULES.find(x=>x.id===t.k);const bad=r.items.find(i=>i.topic===t.k&&i.p<i.max);P.push('• <b>'+TOPICS[t.k]+'</b> ('+t.p+'/'+t.max+' P.): '+TOPIC_TIP[t.k]+(m?' → Wiederhole <b>Modul '+m.nr+'</b>.':''));});}
  const mid=T.filter(t=>t.pct>=60&&t.pct<80);if(mid.length)P.push('<b>Fast sicher:</b> '+mid.map(t=>TOPICS[t.k]).join(', ')+' – hier fehlte nur noch wenig.');
  const typed=r.items.filter(i=>/eingetippt|feste[n]? Zahlen|abgetippt/.test(i.msg)).length;
  if(typed)P.push('💡 Bei '+typed+(typed===1?' Aufgabe':' Aufgaben')+' hast du Ergebnisse oder Zahlen eingetippt. Lass Excel rechnen und klicke Zellen an – dann stimmt alles auch dann noch, wenn sich die Zahlen ändern.');
  const hintTot=Object.values(r.practice).reduce((s,x)=>s+x.hints,0);
  const improved=T.filter(t=>t.pct>=80&&r.practice[t.k]&&r.practice[t.k].hints>=2).map(t=>TOPICS[t.k]);
  if(hintTot===0)P.push('Im Training hast du <b>keinen einzigen Tipp</b> gebraucht. Stark!');
  else if(improved.length)P.push('Im Training hast du bei '+improved.join(' und ')+' noch Tipps gebraucht – im Test hat es dann super geklappt. Üben lohnt sich!');
  P.push(r.note<=2?'Weiter so! Als Nächstes kannst du ausprobieren, Funktionen zu kombinieren, z. B. <code>=WENN(ANZAHL(B5:B10)&gt;3;"viele";"wenige")</code>.':r.note<=4?'Tipp: Wiederhole die genannten Module und mach den Test danach noch einmal.':'Tipp: Starte noch einmal mit Modul 1 und nutze die Merkblätter. Danach klappt der Test bestimmt besser!');
  return P;
}

  else if(d.c2>s.c2){for(let r=s.r1;r<=s.r2;r++){const cells=[];for(let c=s.c1;c<=s.c2;c++)cells.push(sh.cells[A(c,r)]);fillSeries(cells,i=>({dr:0,dc:i}),d.c2-s.c2).forEach((o,i)=>{const k=A(s.c2+1+i,r);if(o)sh.cells[k]=o;else delete sh.cells[k];});}}
  W.sel={r:d.r1,c:d.c1,r2:d.r2,c2:d.c2};W.touched=true;setFx();changed();
}

/* ---------- Prüfen & Tipps ---------- */
const PRAISE=['Richtig! Gut gemacht.','Super, das stimmt!','Klasse gelöst!','Perfekt!','Stark!'];
function check(manual){
  const t=task();if(!t)return;const sh=W.wb.sheets.find(x=>x.name===t.sheet);const r=runCheck(t,sh);const p=tprog(MODULES[W.mi].id,W.ti);
  const last=W.mi===MODULES.length-1&&W.ti===MODULES[W.mi].tasks.length-1;
  if(r.ok){const first=!p.done;p.done=true;saveProg();
    say('✅ '+PRAISE[W.ti%5]+(r.note?'<div class="note">'+r.note+'</div>':'')+' <button class="pri" onclick="go(1)">'+(last?'Zum Abschlusstest →':'Weiter →')+'</button>','ok');
    if(first){toast('✅ Geschafft!');renderTop();const d=document.querySelectorAll('#dots button')[W.ti];if(d){d.classList.add('dn');d.textContent='✓';}}}
  else if(W.touched||manual)say(r.msg,'wn');
  else say(p.done?'✅ Diese Übung hast du schon geschafft. Du kannst sie trotzdem noch einmal üben.':'Probiere es aus – du siehst sofort, ob es stimmt.',p.done?'ok':'');
}
function autoCheck(){const m=MODULES[W.mi];let ch=false;m.tasks.forEach((t,i)=>{if(i===W.ti)return;const p=tprog(m.id,i);if(p.done)return;const sh=W.wb.sheets.find(x=>x.name===t.sheet);if(sh&&runCheck(t,sh).ok){p.done=true;ch=true;}});if(ch){saveProg();renderTop();}}
function hint(){const t=task(),p=tprog(MODULES[W.mi].id,W.ti);const h=t.hints||[];
  if(W.hint<h.length){W.hint++;p.hints++;saveProg();say('💡 <b>Tipp '+W.hint+':</b> '+h[W.hint-1]+(W.hint<h.length?'<div class="note">Brauchst du noch mehr Hilfe? Tippe noch einmal auf 💡 Tipp.</div>':'<div class="note">Immer noch nicht? Ein weiterer Klick zeigt die Lösung.</div>'),'tp');}
  else{p.sol=true;saveProg();say('🔑 <b>Lösung:</b> '+t.solution,'tp');}}

/* ---------- Abschlusstest ---------- */
function openTestIntro(){
  commit();W.view='intro';W.test=false;renderTop();const tested=!!store.get('wb_test',null);
  const total=MODULES.reduce((s,m)=>s+m.tasks.length,0),done=MODULES.reduce((s,m)=>s+modDone(m),0);
  $('#view').innerHTML=`<div class="card intro"><h2>🎓 Abschlusstest: Klassenfahrt der 9b</h2>
   <p>Jetzt zeigst du, was du gelernt hast! Du bekommst eine Excel-Tabelle zur Klassenfahrt mit <b>12 Aufgaben</b> aus allen Themen.</p>
   <div class="bx how"><h3>📋 Regeln</h3><ul><li>Es gibt <b>keine Tipps</b>.</li><li>Rechne immer mit <b>Formeln</b> – eingetippte Ergebnisse zählen nicht.</li><li>Hake jede Aufgabe ab ✓, wenn du fertig bist.</li><li>Am Ende bekommst du Punkte, eine (fiktive) Note und ein persönliches Feedback.</li></ul></div>
   ${done<total?`<div class="bx task" style="font-weight:400">Du hast ${done} von ${total} Übungen geschafft. Am besten übst du erst alle Module – du kannst den Test aber auch jetzt schon machen.</div>`:''}
   <label class="nm">Dein Vorname: <input id="nm" value="${esc(NAME)}" maxlength="30" placeholder="z. B. Lena"></label>
   <div class="ctl"><button class="pri" id="go">${tested?'Test fortsetzen →':'Test starten →'}</button>${store.get('lastResult',null)?'<button id="lr">Letztes Ergebnis ansehen</button>':''}</div></div>`;
  $('#nm').oninput=e=>{NAME=e.target.value.trim();store.set('name',NAME);};
  $('#go').onclick=()=>{if(!NAME){$('#nm').focus();$('#nm').classList.add('need');toast('Bitte zuerst deinen Vornamen eintragen');return;}openTest();};
  const lr=$('#lr');if(lr)lr.onclick=()=>renderResult(store.get('lastResult'));
}
function openTest(){
  const def=buildTestDef();W.def=def;W.wb=loadWB(def);W.undo=[];W.test=true;W.view='test';W.sel={r:5,c:0,r2:5,c2:0};renderTop();saveWB();
  $('#view').innerHTML=`<div class="lay"><aside class="card" id="tl"></aside><section>${xlHTML(def.file)}<div class="fb" id="fb">Klicke links auf eine Aufgabe, um zur Zelle zu springen.</div>
   <div class="ctl"><button id="trs">↺ Test neu starten</button></div></section></div>`;
  $('#trs').onclick=()=>modal('Test neu starten?','Alle deine Eingaben und Häkchen im Test werden gelöscht.',[{t:'Abbrechen'},{t:'Neu starten',p:1,f:()=>{store.del('wb_test');store.del('testChecks');openTest();}}]);
  bindXL();renderGrid();renderTestList();
}
function renderTestList(){
  const ck=new Set(store.get('testChecks',[])),n=TEST_ITEMS.filter(i=>ck.has(i.id)).length,el=$('#tl');
  el.innerHTML=`<div id="cnt">🎓 Abschlusstest · ${esc(NAME)}</div><h2>Klassenfahrt der 9b</h2>
   <div class="tcount"><b>${n} von ${TEST_ITEMS.length}</b> Aufgaben abgehakt</div><div class="pg2"><i style="width:${n/TEST_ITEMS.length*100}%"></i></div>
   ${TEST_ITEMS.map((it,i)=>`<label class="ti ${ck.has(it.id)?'ck':''}" data-c="${it.cell}"><input type="checkbox" data-id="${it.id}" ${ck.has(it.id)?'checked':''}><span class="tx"><b>${i+1}.</b> ${it.text}</span><span class="pt">${it.max} P.</span></label>`).join('')}
   <button class="pri big" id="ab">📨 Test abgeben</button>`;
  el.querySelectorAll('label.ti').forEach(l=>l.addEventListener('click',e=>{if(e.target.tagName==='INPUT')return;e.preventDefault();commit();const p=parseA(l.dataset.c);moveTo(p.r,p.c);}));
  el.querySelectorAll('input[data-id]').forEach(cb=>cb.onchange=()=>{const s=new Set(store.get('testChecks',[]));cb.checked?s.add(cb.dataset.id):s.delete(cb.dataset.id);store.set('testChecks',[...s]);renderTestList();});
  $('#ab').onclick=()=>{commit();const open=TEST_ITEMS.length-new Set(store.get('testChecks',[])).size;
    modal('Test abgeben?',open?`Du hast <b>${open} Aufgabe${open===1?'':'n'}</b> noch nicht abgehakt. Trotzdem abgeben?`:'Alle Aufgaben sind abgehakt. Jetzt abgeben?',[{t:'Weiterarbeiten'},{t:'Jetzt abgeben',p:1,f:gradeTest}]);};
}
function gradeTest(){
  const X=mkCtx(W.wb.sheets[0]);const items=TEST_ITEMS.map((it,i)=>{const g=it.grade(X);return{nr:i+1,topic:it.topic,max:it.max,p:g.p,msg:g.msg,text:it.text};});
  const pts=items.reduce((s,x)=>s+x.p,0),max=items.reduce((s,x)=>s+x.max,0),pct=pts/max*100,note=noteFor(pct);
  const topics={};for(const it of items){topics[it.topic]=topics[it.topic]||{p:0,max:0};topics[it.topic].p+=it.p;topics[it.topic].max+=it.max;}
  const practice={};MODULES.forEach(m=>{let h=0,s=0;m.tasks.forEach((t,i)=>{const p=tprog(m.id,i);h+=p.hints;if(p.sol)s++;});practice[m.id]={hints:h,sol:s};});
  const res={name:NAME,pts,max,pct,note,items,topics,practice,date:fmtDate(todaySerial())};res.feedback=buildFeedback(res);
  store.set('lastResult',res);saveWB();renderResult(res);
}
function renderResult(r){
  if(!r)return openTestIntro();W.view='result';W.test=false;renderTop();scrollTo(0,0);const col=NOTE_COL[r.note];
  $('#view').innerHTML=`<div class="card rtop"><div class="grade" style="background:${col}"><span>Note</span><b>${r.note}</b><span>${NOTE_TXT[r.note]}</span></div>
   <div><div id="cnt">Abschlusstest · ${esc(r.date)}</div><h2>${esc(r.name)}: ${r.pts} von ${r.max} Punkten (${Math.round(r.pct)} %)</h2><small class="mu">Die Note ist fiktiv und dient nur zur Orientierung. Ab 90 % → 1, ab 77 % → 2, ab 63 % → 3, ab 50 % → 4, ab 30 % → 5.</small></div></div>
   <div class="card"><h3 class="h">💬 Dein persönliches Feedback</h3><div class="fbt">${r.feedback.map(p=>'<p>'+p+'</p>').join('')}</div></div>
   <div class="card"><h3 class="h">📊 Punkte nach Themen</h3>${Object.entries(r.topics).map(([k,v])=>{const pc=v.p/v.max*100;return `<div class="tbar"><span>${TOPICS[k]}</span><div class="pg2"><i style="width:${pc}%;background:${pc>=80?'#1d7044':pc>=60?'#d49a00':'#d9480f'}"></i></div><b>${v.p}/${v.max}</b></div>`;}).join('')}</div>
   <div class="card"><h3 class="h">🔍 Alle Aufgaben im Detail</h3><table class="it"><tr><th>Nr.</th><th>Aufgabe</th><th>Punkte</th><th>Kommentar</th></tr>${r.items.map(i=>`<tr><td>${i.nr}</td><td>${i.text}</td><td class="pp" style="color:${i.p===i.max?'#1d7044':i.p>0?'#b07d00':'#c0392b'}">${i.p}/${i.max}</td><td>${i.msg}</td></tr>`).join('')}</table></div>
   <div class="ctl"><button class="pri" id="rt">↺ Test wiederholen</button><button id="rv">Meine Tabelle ansehen</button><button id="rc">📋 Ergebnis kopieren</button><button id="rm">🧱 Zurück zu den Übungen</button></div>`;
  $('#rt').onclick=()=>{store.del('wb_test');store.del('testChecks');openTest();};$('#rv').onclick=openTest;$('#rm').onclick=()=>openTask(0,0);
  $('#rc').onclick=async()=>{const txt=`Excel-Abschlusstest – ${r.name} – ${r.date}\nPunkte: ${r.pts}/${r.max} (${Math.round(r.pct)} %) – fiktive Note ${r.note}\n`+Object.entries(r.topics).map(([k,v])=>`${TOPICS[k]}: ${v.p}/${v.max}`).join('\n')+'\n\n'+r.items.map(i=>`${i.nr}. ${i.p}/${i.max} – ${i.msg.replace(/<[^>]+>/g,'')}`).join('\n');
    try{await navigator.clipboard.writeText(txt);toast('📋 Kopiert!');}catch(e){modal('Kopieren','<textarea style="width:100%;height:220px">'+esc(txt)+'</textarea><p>Markiere den Text und kopiere ihn.</p>',[{t:'OK',p:1}]);}};
}

/* ---------- Dialog ---------- */
function modal(title,html,btns){const old=$('#mask');if(old)old.remove();const m=document.createElement('div');m.className='mask';m.id='mask';
  m.innerHTML=`<div class="dlg"><div class="dh">${title}</div><div class="dc">${html}</div><div class="df">${btns.map((b,i)=>`<button class="${b.p?'pri':''}" data-b="${i}">${b.t}</button>`).join('')}</div></div>`;
  document.body.appendChild(m);m.querySelectorAll('[data-b]').forEach(el=>el.onclick=()=>{const b=btns[+el.dataset.b];m.remove();b.f&&b.f();});}
window.addEventListener('resize',()=>{if($('#g'))paint();});

/* ---------- Start ---------- */
(function(){const f=MODULES.findIndex(m=>modDone(m)<m.tasks.length);if(f<0)openTestIntro();else{const ti=MODULES[f].tasks.findIndex((t,j)=>!tprog(MODULES[f].id,j).done);openTask(f,ti);}})();
</script></body></html>
